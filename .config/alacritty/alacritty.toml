[env]
term = "xterm-256color"

[font.bold]
family = "Hurmit Nerd Font"
style = "Bold"

[font.bold_italic]
family = "Hurmit Nerd Font"
style = "Bold Italic"

[font.italic]
family = "Hurmit Nerd Font"
style = "Italic"

[font.normal]
family = "Hurmit Nerd Font"
style = "Regular"

[font]
size = 9.0

[window]
opacity = 0.97
blur = true

